[package]
name = "pixl"
description = "Pixl tray app: turns screens off when you're not using them"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pixl-core = { path = "../core" }
pixl-platform = { path = "../platform" }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Built as pixl-tray.exe and shipped as Pixl.exe (the installer renames it),
# so it never collides with the copy Tauri bundles next to the settings app.
[[bin]]
name = "pixl-tray"
path = "src/main.rs"
