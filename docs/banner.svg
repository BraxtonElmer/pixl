<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Pixl</title>
  <desc id="d">Pixl's screen view: one screen counting down to turning off, the other already black.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.1" fill="#ffffff" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="canvas"><rect x="600" y="40" width="640" height="340" rx="14"/></clipPath>
  </defs>

  <!-- Window -->
  <rect width="1280" height="420" rx="20" fill="#202020"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Name and words -->
  <g transform="translate(72 96)">
    <rect width="56" height="56" rx="14" fill="#22b5c9"/>
    <rect x="11" y="13" width="34" height="24" rx="4" fill="none" stroke="#0b2a31" stroke-width="4"/>
    <path d="M21 46h14M28 37v9" stroke="#0b2a31" stroke-width="4" stroke-linecap="round"/>
    <rect x="32" y="18" width="7" height="7" rx="1.5" fill="#0b2a31"/>
  </g>
  <text x="146" y="140" fill="#ffffff" font-family="'Segoe UI Variable Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="600" letter-spacing="-0.5">Pixl</text>
  <text x="72" y="214" fill="#ffffff" font-family="'Segoe UI Variable Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600">Protect your OLED</text>
  <text x="72" y="252" fill="#ffffff" font-family="'Segoe UI Variable Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600">from burn-in.</text>
  <text x="72" y="300" fill="#a8a8a8" font-family="'Segoe UI','Segoe UI Variable Text',Helvetica,Arial,sans-serif" font-size="19">Each screen goes black when you stop using it,</text>
  <text x="72" y="326" fill="#a8a8a8" font-family="'Segoe UI','Segoe UI Variable Text',Helvetica,Arial,sans-serif" font-size="19">and comes back the moment you return.</text>

  <!-- The screen view, as in the app -->
  <rect x="600" y="40" width="640" height="340" rx="14" fill="#1a1a1a"/>
  <rect x="600" y="40" width="640" height="340" rx="14" fill="url(#dots)"/>
  <g clip-path="url(#canvas)" font-family="'Segoe UI','Segoe UI Variable Text',Helvetica,Arial,sans-serif">
    <!-- Portrait screen, on and counting down -->
    <g transform="translate(700 78)">
      <rect width="150" height="264" rx="8" fill="#3a4250" stroke="#22b5c9" stroke-width="2.5"/>
      <rect x="12" y="12" width="26" height="26" rx="6" fill="#22b5c9"/>
      <text x="25" y="31" text-anchor="middle" fill="#0b2a31" font-size="15" font-weight="700">2</text>
      <text x="14" y="134" fill="#ffffff" font-size="17" font-weight="600">Off in 29:56</text>
      <text x="14" y="156" fill="#ffffff" fill-opacity="0.75" font-size="13">when the PC is idle</text>
      <text x="14" y="248" fill="#ffffff" fill-opacity="0.75" font-size="13">Monitor 2</text>
    </g>
    <!-- Wide screen, already black -->
    <g transform="translate(862 146)">
      <rect width="320" height="180" rx="8" fill="#050506" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="12" y="12" width="26" height="26" rx="6" fill="#22b5c9"/>
      <text x="25" y="31" text-anchor="middle" fill="#0b2a31" font-size="15" font-weight="700">1</text>
      <text x="14" y="94" fill="#a7adb6" font-size="17" font-weight="600">Off</text>
      <text x="14" y="116" fill="#a7adb6" fill-opacity="0.8" font-size="13">Move the mouse to wake</text>
      <text x="14" y="164" fill="#a7adb6" fill-opacity="0.8" font-size="13">Monitor 1 · Main</text>
    </g>
  </g>
</svg>
